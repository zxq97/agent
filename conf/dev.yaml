env: dev

llm:
  default: deepseek_chat
  providers:
    deepseek_chat:
      name: deepseek
      model: deepseek-chat
      api_key: "sk-c4cceb7a99934b9fa1d1f7bd051d5750"
      base_url: "https://api.deepseek.com"
      timeout: 60
    deepseek_reasoner:
      name: deepseek
      model: deepseek-reasoner
      api_key: "sk-c4cceb7a99934b9fa1d1f7bd051d5750"
      base_url: "https://api.deepseek.com"
      timeout: 120
  agent_bindings:
    shopping: deepseek_chat
    insurance: deepseek_chat
    knowledge: deepseek_reasoner
    supervisor: deepseek_chat

tyche:
  # tyche /controller/mcp/controller.go 暴露的 MCP server 入口。
  endpoint: "http://10.78.133.4:33558/car/rental/inner/mcp"
  # Authorization: Bearer <phone>,需在 tyche Apollo mcp_allowed_phones 白名单。
  # 留空时,tyche 端若白名单也为空可放行(便于本地调试)。
  phone: "00016257309"
  timeout: 30

agent:
  # React loop 最大步数。每次 chatModel/toolsNode 切换各算 1 步。
  # 典型完整流程(locations+resolve_poi+search_quotes+get_order_details+回答)约 9 步。
  # 设 30 保留多轮追问和重试的余量,防止 exceeds max steps 报错。
  max_step: 30

# P4: HTTP 服务化配置
http:
  addr: ":8080"
  read_timeout: 30
  write_timeout: 600        # SSE 长连接,需要较大写超时

# P4: Session 持久化(Redis)
# dev 环境若 redis_addr 留空,会自动降级为内存 store
session:
  redis_addr: ""            # 例如 "127.0.0.1:6379"
  password: ""
  db: 0
  ttl_hours: 24
  key_prefix: "agent:session"

# P4: 限流(按 user_id token bucket)
# 都为 0 时不限流(dev 友好)
ratelimit:
  per_minute: 0
  per_day: 0
