env: prod

llm:
  default: deepseek_chat
  providers:
    deepseek_chat:
      name: deepseek
      model: deepseek-chat
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com"
      timeout: 60
    deepseek_reasoner:
      name: deepseek
      model: deepseek-reasoner
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com"
      timeout: 120
  agent_bindings:
    shopping: deepseek_chat
    insurance: deepseek_chat
    knowledge: deepseek_reasoner
    supervisor: deepseek_chat

tyche:
  endpoint: "${TYCHE_MCP_ENDPOINT:-http://tyche.intra/car/rental/inner/mcp}"
  phone: "${TYCHE_MCP_PHONE}"
  timeout: 30

agent:
  max_step: 30

# P4: HTTP 服务化
http:
  addr: ":8080"
  read_timeout: 30
  write_timeout: 600

# P4: Redis Session 持久化
session:
  redis_addr: "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 0
  ttl_hours: 24
  key_prefix: "agent:session"

# P4: 限流
ratelimit:
  per_minute: 30
  per_day: 1000
